name: My First Workflow

on:
  push:

jobs:
  print-statements:
    runs-on: ubuntu-latest
    steps:
      - name: Print first statement
        run: echo "Hi, this is the first statement!"

      - name: Print second statement
        run: echo "This is the second one!"

  confirm-statements-printed:
    runs-on: ubuntu-latest
    needs: print-statements
    steps:
      - name: Confirm statements printed
        run: echo "The first job succeeded!"
